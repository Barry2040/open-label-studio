# Veröffentlicht die App bei jedem Upload auf main über GitHub Pages.
# Die Startadresse (index.html) ist direkt die App.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Seite zusammenstellen
        run: |
          mkdir _site
          cp label-studio/label-studio.html _site/index.html
          cp label-studio/label-studio.html _site/label-studio.html
          # installierbare App: Manifest, Offline-Speicher und Symbole
          cp label-studio/manifest.webmanifest label-studio/sw.js label-studio/icon*.svg label-studio/icon*.png _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
