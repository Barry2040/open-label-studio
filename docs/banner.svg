    <rect x="670" y="220" width="128" height="36" rx="18" fill="#1e3a8a"/><text x="734" y="244" text-anchor="middle" fill="#bfdbfe">Bluetooth</text>
    <rect x="810" y="220" width="170" height="36" rx="18" fill="#1e3a8a"/><text x="895" y="244" text-anchor="middle" fill="#bfdbfe">PNG · SVG · PDF</text>
