      <rect x="194" y="98" width="20" height="20"/>
    </g>
  </g>
  <text x="420" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="700" fill="#ffffff">Label Studio</text>
  <text x="422" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#9ca3af">Etiketten gestalten und drucken – für Phomemo M220 &amp; Co.</text>
