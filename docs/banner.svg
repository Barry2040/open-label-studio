<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Label Studio – Etiketten-App für Phomemo-Drucker">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#16213a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <!-- Etikett -->
  <g transform="translate(90 70) rotate(-4 130 80)">
    <rect width="260" height="170" rx="18" fill="#ffffff"/>
    <rect x="12" y="12" width="236" height="146" rx="12" fill="none" stroke="#111827" stroke-width="5"/>
    <rect x="34" y="40" width="120" height="18" rx="4" fill="#111827"/>
    <rect x="34" y="72" width="150" height="10" rx="3" fill="#9ca3af"/>
    <rect x="34" y="92" width="110" height="10" rx="3" fill="#9ca3af"/>
